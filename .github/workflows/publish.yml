# Publishes to pub.dev when a version tag is pushed (for example v0.2.2). No secret is stored: GitHub proves to
# pub.dev who it is. One-time setup on pub.dev: this package's Admin tab, Automated publishing, enable it for this
# repository with the tag pattern v{{version}}. The version in pubspec.yaml must match the tag.
name: Publish to pub.dev

on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+']

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      id-token: write # lets GitHub authenticate to pub.dev
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Tag must match pubspec.yaml
        run: test "v$(grep '^version:' pubspec.yaml | awk '{print $2}')" = "${GITHUB_REF_NAME}"

      - name: Sign in to pub.dev with this workflow's identity
        run: |
          TOKEN=$(curl -sf -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=https://pub.dev" | jq -r .value)
          echo "::add-mask::${TOKEN}"
          echo "PUB_TOKEN=${TOKEN}" >> "$GITHUB_ENV"
          PUB_TOKEN="${TOKEN}" dart pub token add https://pub.dev --env-var PUB_TOKEN

      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - run: flutter pub publish --force
