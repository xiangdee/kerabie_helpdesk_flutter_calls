name: kerabie_helpdesk_flutter_calls
description: Voice and video calls, and live voice with the AI agent and its orb, for the Kerabie help desk in a Flutter app. Built on kerabie_helpdesk_flutter.
version: 0.4.0
homepage: https://kerabie.com/sdks/flutter
repository: https://github.com/xiangdee/kerabie_helpdesk_flutter_calls
issue_tracker: https://github.com/xiangdee/kerabie_helpdesk_flutter_calls/issues
documentation: https://kerabie.com/docs/sdks/flutter
topics:
  - calls
  - customer-support
  - helpdesk
  - webrtc

environment:
  sdk: ">=3.6.0 <4.0.0"
  flutter: ">=3.27.0"

dependencies:
  flutter:
    sdk: flutter
  kerabie_helpdesk_flutter: ^0.6.1
  livekit_client: ^2.13.0
  record: ^6.0.0
  flutter_pcm_sound: ^3.0.0

dev_dependencies:
  fake_async: ^1.3.3
  flutter_lints: ^4.0.0
  flutter_test:
    sdk: flutter
